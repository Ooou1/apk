name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 配置 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 自动生成安卓工程结构并打包 APK
      run: |
        mkdir -p app/src/main/java/com/guard
        cp MainActivity.java GuardVpnService.java FloatingService.java app/src/main/java/com/guard/

        cat << 'EOF' > settings.gradle
        rootProject.name = "NetGuardPro"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.guard'
            compileSdk 34
            defaultConfig {
                applicationId "com.guard.netpro"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application
                android:label="NetGuard Pro"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".GuardVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                    <intent-filter>
                        <action android:name="android.net.VpnService" />
                    </intent-filter>
                </service>
                <service android:name=".FloatingService" android:exported="false" />
            </application>
        </manifest>
        EOF

        gradle assembleDebug

    - name: 4. 上传生成的 APK
      uses: actions/upload-artifact@v4
      with:
        name: NetGuardPro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
