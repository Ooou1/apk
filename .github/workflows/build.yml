name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 配置 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. 生成混淆正式版 APK
      run: |
        mkdir -p app/src/main/java/com/guard
        cp MainActivity.java GuardVpnService.java FloatingService.java app/src/main/java/com/guard/

        # 自动生成正式签名证书
        keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 \
          -alias releasekey -storepass 123456 -keypass 123456 \
          -dname "CN=Pro, OU=Dev, O=Pro, L=BJ, ST=BJ, C=CN"

        cat << 'EOF' > settings.gradle
        rootProject.name = "SpeedPro"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/proguard-rules.pro
        -keep public class com.guard.MainActivity
        -keep public class com.guard.GuardVpnService
        -keep public class com.guard.FloatingService
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.guard'
            compileSdk 34
            defaultConfig {
                applicationId "com.guard.speedpro"
                minSdk 24
                targetSdk 33
                versionCode 2
                versionName "2.0"
            }
            signingConfigs {
                release {
                    storeFile file("release.jks")
                    storePassword "123456"
                    keyAlias "releasekey"
                    keyPassword "123456"
                }
            }
            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    signingConfig signingConfigs.release
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application
                android:label="极速助手 PRO"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".GuardVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                    <intent-filter>
                        <action android:name="android.net.VpnService" />
                    </intent-filter>
                </service>
                <service android:name=".FloatingService" android:exported="false" />
            </application>
        </manifest>
        EOF

        gradle assembleRelease

    - name: 4. 上传正式版 APK
      uses: actions/upload-artifact@v4
      with:
        name: SpeedPro-Release-APK
        path: app/build/outputs/apk/release/app-release.apk
